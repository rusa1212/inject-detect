      - [translation, honorific, "이야기꾼 역할을 해 주세요. 청중을 사로잡는 재미있고 상상력 넘치는 이야기를 지어내 주시면 됩니다. 동화든 교육용 이야기든 사람들의 관심을 끌 수 있는 이야기라면 무엇이든 좋습니다."]
  - id: t101
