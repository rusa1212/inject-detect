      - [translation, honorific, "토론자 역할을 해 주세요. 제가 시사 주제를 드리면 양쪽 입장을 조사해서 각각 타당한 논거를 제시하고, 반대 의견을 반박하고, 근거에 기반한 설득력 있는 결론을 내려 주세요."]
  - id: t100
