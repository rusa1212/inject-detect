# S3-1 포맷 예시 룰. 실제 영어/한국어 룰셋은 S3-2(en.yaml), S3-3(ko.yaml)에서 추가한다.
# 패턴은 normalize() 결과(소문자, 공백 정리됨)에 매칭된다.
version: 1
rules:
  - id: sample-en-override
    lang: en
    category: instruction_override
    pattern: '\bignore\s+(all\s+)?(the\s+)?previous\s+instructions?\b'
    weight: 0.9
    description: 포맷 예시 - 이전 지시 무시 (영어)
  - id: sample-ko-leak
    lang: ko
    category: prompt_leak
    pattern: '시스템\s*프롬프트\S*\s*(알려|보여|출력)'
    weight: 0.9
    description: 포맷 예시 - 시스템 프롬프트 유출 요구 (한국어)
